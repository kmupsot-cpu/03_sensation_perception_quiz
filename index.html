ansparent!important}footer{font-size:9pt}}
</style></head><body><main><header><div class="sub">心理疾病職能治療學 · 115 學年度第 1 學期</div><h1>感覺、知覺和認知｜課後測驗</h1><p>15 題四選一單選題，每題僅有一個最適當答案。建議作答時間 25–30 分鐘。</p><p class="sub">每題 1 分，滿分 15 分。請依講義概念與題目情境作答。</p><div class="identity"><label>姓名 <input aria-label="姓名"></label><label>學號 <input aria-label="學號"></label></div></header><div class="tools"><button class="primary" id="grade">提交並計分</button><button id="answers" aria-pressed="false">顯示答案與解析</button><button id="print">列印／另存 PDF</button><button id="reset">清除作答</button></div><p class="sub screen-note">可離線使用，作答不會傳送至網路，重新載入後會清除。列印學生題本前，請先隱藏答案與解析。</p><div id="result" role="status" aria-live="polite"></div><form id="quiz"></form><noscript><p>JavaScript 未啟用：以下提供靜態題本與答案，啟用後可使用計分功能。</p><ol><li><p>個案能察覺紙上的明暗與線條，卻難以將零散線段整合成完整物體輪廓。此困難最直接涉及哪一項處理？</p><ol type="A"><li>感覺受器是否接收到光線</li><li>知覺層次的全域輪廓整合</li><li>前瞻記憶中未來行動的記憶</li><li>決策時對不同選項的比較</li></ol></li><li><p>治療師比較兩種皮膚機械受器的功能。下列配對何者符合講義？</p><ol type="A"><li>帕西尼氏小體主要偵測肌肉長度變化；肌梭主要偵測高頻振動</li><li>默克爾盤主要傳遞痛溫覺；自由神經末梢主要辨識物體輪廓</li><li>邁斯納氏小體主要偵測持續性皮膚牽張；魯菲尼氏終末主要偵測低頻顫動</li><li>帕西尼氏小體與高頻振動有關；默克爾盤與物體質地及輪廓辨識有關</li></ol></li><li><p>右側視放射的 Meyer 環受損時，依講義最可能出現哪一種視野缺損？</p><ol type="A"><li>左側上方象限盲</li><li>右眼單眼全盲</li><li>雙顳側偏盲</li><li>右側下方象限盲</li></ol></li><li><p>個案依治療師指示，先核對收據，再切換到採購清單，之後又回到收據；每次只處理其中一項。此任務最直接要求哪種注意力？</p><ol type="A"><li>分配性注意力：同時處理兩項任務</li><li>持續注意力：長時間維持同一目標</li><li>轉換性注意力：在不同任務要求間切換</li><li>刺激驅動注意力：被突然聲響吸引</li></ol></li><li><p>個案在安靜環境可聽懂指令，但在其他人交談時容易跟錯活動步驟。若先針對選擇性注意力的需求調整，何者最合適？</p><ol type="A"><li>在原指令外再加入多段無關聲音，增加訊息量</li><li>降低背景談話干擾，並清楚標示目前需要注意的指令</li><li>只增加活動步驟數，讓個案更努力記憶</li><li>要求同時聽兩位治療師不同的指令</li></ol></li><li><p>個案記得自己昨天的復健經過，也能熟練完成已學會的摺衣步驟，卻常忘記「午餐後要把表單交給治療師」。最後這項困難最直接涉及何種記憶？</p><ol type="A"><li>前瞻記憶：記得在未來適當時機執行預定行動</li><li>程序記憶：已學會的操作技能</li><li>語意記憶：一般事實與概念知識</li><li>事件記憶：回想已發生的個人經驗</li></ol></li><li><p>個案聽到短暫代碼後立即默念，以便幾秒後輸入裝置。依多重儲存模式，默念最直接屬於哪項歷程？</p><ol type="A"><li>干擾：讓新舊資訊相互競爭</li><li>置換：以新代碼擠出所有舊資訊</li><li>衰退：使訊息自然消失</li><li>重複演練：維持並處理剛接收到的訊息</li></ol></li><li><p>個案能說出每項烹飪步驟，卻無法安排先後、發現缺少材料後也不知如何調整。治療師應優先進一步分析哪一方面？</p><ol type="A"><li>僅分析觸覺受器是否完整</li><li>僅評估是否能背出食材名稱</li><li>計畫、組織與問題解決等執行功能如何影響烹飪</li><li>直接以聽力受損解釋全部問題</li></ol></li><li><p>哪一種評估安排最能同時呈現講義強調的「生態效度」與「動態評估」？</p><ol type="A"><li>只在治療室測詞彙背誦，依總分推定所有居家能力</li><li>在模擬廚房觀察備餐，並記錄個案採取的策略、錯誤與不同提示下的表現</li><li>只詢問家屬是否滿意，不觀察個案活動</li><li>僅記錄備餐是否完成，忽略過程與協助程度</li></ol></li><li><p>接受 DLOTCA 評估的個案，起初未能完成某項認知作業，經提示後改善。相較於只記錄初次成績，這項資訊最能協助了解什麼？</p><ol type="A"><li>是否可不經其他資料就確定疾病診斷</li><li>是否能直接推定個案所有日常活動均可獨立</li><li>是否只需要記錄動作速度而忽略策略</li><li>哪些表現可在指導下改善，以及可用的學習潛能</li></ol></li><li><p>兩名個案在 EFPT 的同一任務中皆完成活動；甲可獨立完成，乙需多項協助。依講義的計分方向，下列何者正確？</p><ol type="A"><li>乙在相應評估面向通常分數較高，反映所需協助較多</li><li>甲分數一定較高，因為分數越高代表越獨立</li><li>兩人皆完成任務，所有面向必須得到相同分數</li><li>只要最後完成，提示程度不影響評估</li></ol></li><li><p>治療師想了解個案能否依不同規則分類物品、改變分類方式，以及使用何種分類策略。依講義，最符合目的的工具為何？</p><ol type="A"><li>情境式記憶測驗（CMT）</li><li>艾倫認知階層篩選測驗（ACLS）</li><li>托格里亞分類測驗（TCA）</li><li>做點吃的測驗（Do-Eat）</li></ol></li><li><p>個案因記憶困難常漏掉收拾流程。治療師把步驟圖卡固定在工作桌上，協助他完成當下活動。若以這項措施的直接目的判斷，最符合哪種取向？</p><ol type="A"><li>認知矯治：透過反覆認知作業直接修復記憶功能</li><li>純粹測驗：不提供任何支持來確認獨立能力</li><li>單純增加工作難度，以測量壓力下的反應</li><li>代償：運用外在線索支持功能性活動表現</li></ol></li><li><p>個案學習新的固定操作流程時，反覆猜測容易記住錯誤步驟。若採無錯誤學習原則，下列設計何者最適當？</p><ol type="A"><li>先讓他大量猜錯，再於活動結束後一次糾正</li><li>預先提供清楚正確示範與足夠提示，降低錯誤發生，再依表現調整支持</li><li>避免任何示範與提示，以免影響自主探索</li><li>持續改變操作規則，讓每次流程都不相同</li></ol></li><li><p>個案需暫記九個數字，治療師引導他將數字依序分成三組，每組三個，以減少一次處理的單位數。此策略最符合何者？</p><ol type="A"><li>分群（Chunking）</li><li>間時提取訓練（Spaced Retrieval Training）</li><li>記憶宮殿法（Method of Loci）</li><li>心智圖法（Mind Mapping）</li></ol></li></ol><details><summary>參考答案與解析</summary><p><strong>1. B</strong>：察覺明暗與線條不等同已完成物體輪廓整合。講義將全域輪廓整合列為把孤立線段組成完整輪廓的知覺處理。題幹不足以直接推定特定診斷或腦部損傷位置。（第 10、12 張）</p><p><strong>2. D</strong>：講義指出帕西尼氏小體傳遞高頻振動，默克爾盤與物體質地、輪廓辨識密切相關。肌肉長度變化、皮膚牽張與痛溫覺則涉及不同受器，不能互換。（第 5 張）</p><p><strong>3. A</strong>：Meyer 環繞入顳葉，其受損典型對應對側上方象限盲，因此右側病灶對應左側上方象限。此題考視覺路徑的對應關係，不代表僅憑單一表現即可完成臨床定位。（第 7 張）</p><p><strong>4. C</strong>：題幹強調依要求在收據與清單間來回切換，且每次處理一項，最符合轉換性注意力。分配性注意力則強調同時分配資源處理多項要求。（第 14 張）</p><p><strong>5. B</strong>：選擇性注意力涉及在競爭訊息中選取相關內容。降低無關聲音與強化重要訊息，能先減少篩選負荷；多加無關刺激或同時指令並不能直接協助當下表現。（第 14–16 張）</p><p><strong>6. A</strong>：前瞻記憶涉及在未來適當時機記得執行預定事項。昨日經過較接近事件記憶，熟練摺衣則涉及程序記憶，三者不可互相替代。（第 17 張）</p><p><strong>7. D</strong>：講義以重複演練（Rehearsal）說明訊息維持與後續儲存的歷程。默念代碼屬於主動演練，並不等同保證訊息已形成穩定長期記憶。（第 18 張）</p><p><strong>8. C</strong>：知道步驟並不等於能組織與調整實際活動。題幹指向計畫、組織及問題解決等高階歷程；職能治療評估還須連結這些困難與烹飪表現，而非只列出認知缺損名稱。（第 13、20、23–24 張）</p><p><strong>9. B</strong>：模擬廚房能接近日常活動要求；記錄策略與提示下的變化，則可了解解題歷程、可用優勢與學習需求。兩者分別呼應生態效度與動態評估。（第 23–24 張）</p><p><strong>10. D</strong>：講義強調 DLOTCA 透過動態評量的提示與指導，了解學習潛能及可改善的表現。提示後改善能協助介入規劃，但不能直接等同診斷或全面生活獨立。（第 25 張）</p><p><strong>11. A</strong>：EFPT 各面向使用 0–5 分的協助程度計分，0 分表示獨立，5 分表示完全依賴。因此不能只看活動有沒有完成，還要看起始、組織、順序、判斷及完成等面向的協助需求。（第 27 張）</p><p><strong>12. C</strong>：TCA 以不同大小、顏色等特徵的餐具評估分類、分類方式轉換與策略使用。CMT 著重記憶、後設記憶與策略；ACLS 利用皮革邊縫篩檢認知階層；Do-Eat 則使用兒童日常任務。（第 28 張）</p><p><strong>13. D</strong>：圖卡提供外在支持，直接目的是補足記憶困難並促成活動完成，因此屬代償取向。這與以恢復受損認知功能為主要目的的認知矯治有所不同。（第 31–32 張）</p><p><strong>14. B</strong>：無錯誤學習重點是設計環境、提供正確範例及適當提示，減少學習錯誤，而非要求大量試錯。此題考策略設計，不以某一診斷直接決定所有個案都適用。（第 33 張）</p><p><strong>15. A</strong>：分群將零散資訊組成較有組織的單位。間時提取著重不同時間間隔下的提取練習；記憶宮殿則連結空間位置；心智圖以圖式呈現概念關係，均與題幹設計不同。（第 35 張）</p></details></noscript><footer>命題依據：《115-1 03 感覺、知覺和認知 (40P)(feedback)》講義（檔案共 57 張投影片，含課堂回饋頁）。情境為依講義概念改寫，非量表原始題項。解析頁次依檔案中的投影片順序計算。</footer></main><script>
const questions=[{"topic": "感覺與知覺處理", "ref": "第 10、12 張", "q": "個案能察覺紙上的明暗與線條，卻難以將零散線段整合成完整物體輪廓。此困難最直接涉及哪一項處理？", "o": ["感覺受器是否接收到光線", "知覺層次的全域輪廓整合", "前瞻記憶中未來行動的記憶", "決策時對不同選項的比較"], "a": 1, "e": "察覺明暗與線條不等同已完成物體輪廓整合。講義將全域輪廓整合列為把孤立線段組成完整輪廓的知覺處理。題幹不足以直接推定特定診斷或腦部損傷位置。"}, {"topic": "軀體感覺受器", "ref": "第 5 張", "q": "治療師比較兩種皮膚機械受器的功能。下列配對何者符合講義？", "o": ["帕西尼氏小體主要偵測肌肉長度變化；肌梭主要偵測高頻振動", "默克爾盤主要傳遞痛溫覺；自由神經末梢主要辨識物體輪廓", "邁斯納氏小體主要偵測持續性皮膚牽張；魯菲尼氏終末主要偵測低頻顫動", "帕西尼氏小體與高頻振動有關；默克爾盤與物體質地及輪廓辨識有關"], "a": 3, "e": "講義指出帕西尼氏小體傳遞高頻振動，默克爾盤與物體質地、輪廓辨識密切相關。肌肉長度變化、皮膚牽張與痛溫覺則涉及不同受器，不能互換。"}, {"topic": "視野與視覺路徑", "ref": "第 7 張", "q": "右側視放射的 Meyer 環受損時，依講義最可能出現哪一種視野缺損？", "o": ["左側上方象限盲", "右眼單眼全盲", "雙顳側偏盲", "右側下方象限盲"], "a": 0, "e": "Meyer 環繞入顳葉，其受損典型對應對側上方象限盲，因此右側病灶對應左側上方象限。此題考視覺路徑的對應關係，不代表僅憑單一表現即可完成臨床定位。"}, {"topic": "注意力分類", "ref": "第 14 張", "q": "個案依治療師指示，先核對收據，再切換到採購清單，之後又回到收據；每次只處理其中一項。此任務最直接要求哪種注意力？", "o": ["分配性注意力：同時處理兩項任務", "持續注意力：長時間維持同一目標", "轉換性注意力：在不同任務要求間切換", "刺激驅動注意力：被突然聲響吸引"], "a": 2, "e": "題幹強調依要求在收據與清單間來回切換，且每次處理一項，最符合轉換性注意力。分配性注意力則強調同時分配資源處理多項要求。"}, {"topic": "選擇性注意力", "ref": "第 14–16 張", "q": "個案在安靜環境可聽懂指令，但在其他人交談時容易跟錯活動步驟。若先針對選擇性注意力的需求調整，何者最合適？", "o": ["在原指令外再加入多段無關聲音，增加訊息量", "降低背景談話干擾，並清楚標示目前需要注意的指令", "只增加活動步驟數，讓個案更努力記憶", "要求同時聽兩位治療師不同的指令"], "a": 1, "e": "選擇性注意力涉及在競爭訊息中選取相關內容。降低無關聲音與強化重要訊息，能先減少篩選負荷；多加無關刺激或同時指令並不能直接協助當下表現。"}, {"topic": "記憶類型", "ref": "第 17 張", "q": "個案記得自己昨天的復健經過，也能熟練完成已學會的摺衣步驟，卻常忘記「午餐後要把表單交給治療師」。最後這項困難最直接涉及何種記憶？", "o": ["前瞻記憶：記得在未來適當時機執行預定行動", "程序記憶：已學會的操作技能", "語意記憶：一般事實與概念知識", "事件記憶：回想已發生的個人經驗"], "a": 0, "e": "前瞻記憶涉及在未來適當時機記得執行預定事項。昨日經過較接近事件記憶，熟練摺衣則涉及程序記憶，三者不可互相替代。"}, {"topic": "多重儲存模式", "ref": "第 18 張", "q": "個案聽到短暫代碼後立即默念，以便幾秒後輸入裝置。依多重儲存模式，默念最直接屬於哪項歷程？", "o": ["干擾：讓新舊資訊相互競爭", "置換：以新代碼擠出所有舊資訊", "衰退：使訊息自然消失", "重複演練：維持並處理剛接收到的訊息"], "a": 3, "e": "講義以重複演練（Rehearsal）說明訊息維持與後續儲存的歷程。默念代碼屬於主動演練，並不等同保證訊息已形成穩定長期記憶。"}, {"topic": "執行功能與功能性認知", "ref": "第 13、20、23–24 張", "q": "個案能說出每項烹飪步驟，卻無法安排先後、發現缺少材料後也不知如何調整。治療師應優先進一步分析哪一方面？", "o": ["僅分析觸覺受器是否完整", "僅評估是否能背出食材名稱", "計畫、組織與問題解決等執行功能如何影響烹飪", "直接以聽力受損解釋全部問題"], "a": 2, "e": "知道步驟並不等於能組織與調整實際活動。題幹指向計畫、組織及問題解決等高階歷程；職能治療評估還須連結這些困難與烹飪表現，而非只列出認知缺損名稱。"}, {"topic": "動態評估與生態效度", "ref": "第 23–24 張", "q": "哪一種評估安排最能同時呈現講義強調的「生態效度」與「動態評估」？", "o": ["只在治療室測詞彙背誦，依總分推定所有居家能力", "在模擬廚房觀察備餐，並記錄個案採取的策略、錯誤與不同提示下的表現", "只詢問家屬是否滿意，不觀察個案活動", "僅記錄備餐是否完成，忽略過程與協助程度"], "a": 1, "e": "模擬廚房能接近日常活動要求；記錄策略與提示下的變化，則可了解解題歷程、可用優勢與學習需求。兩者分別呼應生態效度與動態評估。"}, {"topic": "DLOTCA 的評估重點", "ref": "第 25 張", "q": "接受 DLOTCA 評估的個案，起初未能完成某項認知作業，經提示後改善。相較於只記錄初次成績，這項資訊最能協助了解什麼？", "o": ["是否可不經其他資料就確定疾病診斷", "是否能直接推定個案所有日常活動均可獨立", "是否只需要記錄動作速度而忽略策略", "哪些表現可在指導下改善，以及可用的學習潛能"], "a": 3, "e": "講義強調 DLOTCA 透過動態評量的提示與指導，了解學習潛能及可改善的表現。提示後改善能協助介入規劃，但不能直接等同診斷或全面生活獨立。"}, {"topic": "EFPT 的功能性評估", "ref": "第 27 張", "q": "兩名個案在 EFPT 的同一任務中皆完成活動；甲可獨立完成，乙需多項協助。依講義的計分方向，下列何者正確？", "o": ["乙在相應評估面向通常分數較高，反映所需協助較多", "甲分數一定較高，因為分數越高代表越獨立", "兩人皆完成任務，所有面向必須得到相同分數", "只要最後完成，提示程度不影響評估"], "a": 0, "e": "EFPT 各面向使用 0–5 分的協助程度計分，0 分表示獨立，5 分表示完全依賴。因此不能只看活動有沒有完成，還要看起始、組織、順序、判斷及完成等面向的協助需求。"}, {"topic": "工具與評估目的配對", "ref": "第 28 張", "q": "治療師想了解個案能否依不同規則分類物品、改變分類方式，以及使用何種分類策略。依講義，最符合目的的工具為何？", "o": ["情境式記憶測驗（CMT）", "艾倫認知階層篩選測驗（ACLS）", "托格里亞分類測驗（TCA）", "做點吃的測驗（Do-Eat）"], "a": 2, "e": "TCA 以不同大小、顏色等特徵的餐具評估分類、分類方式轉換與策略使用。CMT 著重記憶、後設記憶與策略；ACLS 利用皮革邊縫篩檢認知階層；Do-Eat 則使用兒童日常任務。"}, {"topic": "矯治與代償", "ref": "第 31–32 張", "q": "個案因記憶困難常漏掉收拾流程。治療師把步驟圖卡固定在工作桌上，協助他完成當下活動。若以這項措施的直接目的判斷，最符合哪種取向？", "o": ["認知矯治：透過反覆認知作業直接修復記憶功能", "純粹測驗：不提供任何支持來確認獨立能力", "單純增加工作難度，以測量壓力下的反應", "代償：運用外在線索支持功能性活動表現"], "a": 3, "e": "圖卡提供外在支持，直接目的是補足記憶困難並促成活動完成，因此屬代償取向。這與以恢復受損認知功能為主要目的的認知矯治有所不同。"}, {"topic": "無錯誤學習", "ref": "第 33 張", "q": "個案學習新的固定操作流程時，反覆猜測容易記住錯誤步驟。若採無錯誤學習原則，下列設計何者最適當？", "o": ["先讓他大量猜錯，再於活動結束後一次糾正", "預先提供清楚正確示範與足夠提示，降低錯誤發生，再依表現調整支持", "避免任何示範與提示，以免影響自主探索", "持續改變操作規則，讓每次流程都不相同"], "a": 1, "e": "無錯誤學習重點是設計環境、提供正確範例及適當提示，減少學習錯誤，而非要求大量試錯。此題考策略設計，不以某一診斷直接決定所有個案都適用。"}, {"topic": "記憶策略應用", "ref": "第 35 張", "q": "個案需暫記九個數字，治療師引導他將數字依序分成三組，每組三個，以減少一次處理的單位數。此策略最符合何者？", "o": ["分群（Chunking）", "間時提取訓練（Spaced Retrieval Training）", "記憶宮殿法（Method of Loci）", "心智圖法（Mind Mapping）"], "a": 0, "e": "分群將零散資訊組成較有組織的單位。間時提取著重不同時間間隔下的提取練習；記憶宮殿則連結空間位置；心智圖以圖式呈現概念關係，均與題幹設計不同。"}];const form=document.getElementById('quiz');const letters='ABCD';let visible=false,graded=false;
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
questions.forEach((q,i)=>{const a=el('article');const fs=el('fieldset');const legend=el('legend');legend.append(el('h2','',`${i+1}. ${q.q}`));fs.append(legend);q.o.forEach((o,j)=>{const l=el('label','option');l.id=`q${i}o${j}`;const r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=j;l.append(r,el('span','',letters[j]+'. '+o));fs.append(l)});const e=el('div','explanation hidden');e.append(el('strong','',`答案：${letters[q.a]} ｜ ${q.topic}`),el('p','',q.e),el('p','source','講義依據：'+q.ref));a.append(fs,el('div','feedback'),e);form.append(a)});
function clearMarks(){document.querySelectorAll('.option').forEach(n=>n.classList.remove('correct','wrong'));document.querySelectorAll('.feedback').forEach(n=>n.textContent='')}
function show(v){visible=v;document.querySelectorAll('.explanation').forEach(n=>n.classList.toggle('hidden',!v));document.getElementById('answers').textContent=v?'隱藏答案與解析':'顯示答案與解析';document.getElementById('answers').setAttribute('aria-pressed',String(v))}
document.getElementById('grade').onclick=()=>{clearMarks();let score=0,done=0;questions.forEach((q,i)=>{const r=form.querySelector(`input[name="q${i}"]:checked`);const f=form.children[i].querySelector('.feedback');if(r){done++;const v=Number(r.value);if(v===q.a){score++;f.textContent='答對'}else{f.textContent=`答錯，正確答案為 ${letters[q.a]}`;document.getElementById(`q${i}o${v}`).classList.add('wrong')}}else f.textContent=`未作答，正確答案為 ${letters[q.a]}`;document.getElementById(`q${i}o${q.a}`).classList.add('correct')});document.getElementById('result').textContent=`得分 ${score}／15 分（${Math.round(score/15*100)}%）・已答 ${done} 題・未答 ${15-done} 題。未答題以 0 分計。`;graded=true;show(true)};
document.getElementById('answers').onclick=()=>{show(!visible);if(!visible){clearMarks();graded=false;document.getElementById('result').textContent=''}};
form.addEventListener('change',()=>{if(graded){clearMarks();graded=false;document.getElementById('result').textContent='作答已變更，請重新提交計分。'}});
document.getElementById('reset').onclick=()=>{form.reset();clearMarks();show(false);graded=false;document.getElementById('result').textContent='已清除作答。'};document.getElementById('print').onclick=()=>window.print();
</script></body></html>
